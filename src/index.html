<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F7F4" />
    <title>Зоряна Тепла — лікар ортодонт у Києві</title>
    <meta
      name="description"
      content="Зоряна Тепла — стоматолог-ортодонт у Києві. 20+ років досвіду. Ортодонтичне лікування дітей і дорослих, брекети, елайнери та діагностика прикусу."
    />
    <link rel="icon" type="image/png" sizes="96x96" href="%BASE_URL%favicon-zt.png?v=zt1" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico?v=zt1" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png?v=zt1" />
    <script>
      // A browser refresh of the home page starts from its opening screen.
      // Preserve deep links on normal navigation and reloads of standalone pages.
      var teplaNavigation = performance.getEntriesByType('navigation')[0]
      var teplaBase = new URL('%BASE_URL%', location.href).pathname.replace(/\/$/, '')
      var teplaPath = location.pathname.replace(/\/$/, '')
      var teplaReload = teplaNavigation
        ? teplaNavigation.type === 'reload'
        : performance.navigation && performance.navigation.type === 1
      if (teplaReload && (teplaPath === teplaBase || teplaPath === teplaBase + '/en')) {
        history.scrollRestoration = 'manual'
        if (location.hash)
          history.replaceState(history.state, '', location.pathname + location.search)
        window.scrollTo({ top: 0, behavior: 'instant' })
        window.addEventListener(
          'pageshow',
          function () {
            var currentPath = location.pathname.replace(/\/$/, '')
            if (!location.hash && (currentPath === teplaBase || currentPath === teplaBase + '/en'))
              window.scrollTo({ top: 0, behavior: 'instant' })
          },
          { once: true },
        )
      }
      var teplaTheme = null
      try {
        teplaTheme = localStorage.getItem('tepla-theme')
      } catch (_) {}
      var teplaDark =
        teplaTheme === 'dark' ||
        (teplaTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = teplaDark ? 'dark' : 'light'
      document.documentElement.style.colorScheme = teplaDark ? 'dark' : 'light'
      document.querySelector('meta[name="theme-color"]').content = teplaDark ? '#14201a' : '#f8f5ee'
    </script>
    <!--seo-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
